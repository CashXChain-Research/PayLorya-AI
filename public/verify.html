<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Confirm your email · PayFlow AI</title>
<meta name="description" content="Confirm your email with the code we sent you.">
<script src="/assets/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/auth.css">
<script type="module" src="/assets/auth.js"></script>
</head>
<body class="auth">
<nav class="nav">
  <div class="wrap nav-in">
    <a class="logo" href="/"><span class="mark">X</span>CashXChain<span class="tag">AI CFO</span></a>
    <div class="nav-right">
      <a class="nav-link" href="/demo">Live demo</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="auth-main">
  <section class="auth-card reveal" aria-labelledby="auth-h">
    <span class="mark lg" aria-hidden="true">X</span>
    <h1 id="auth-h">Check your email</h1>
    <p class="sub" id="verify-sub">Enter the 6-digit code we emailed you. It expires in 10 minutes.</p>

    <div class="form-err" id="form-err" role="alert" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span></span>
    </div>

    <form data-auth="verify" novalidate>
      <div class="field" id="email-field">
        <label for="f-email">Email</label>
        <div class="input">
          <input id="f-email" name="email" type="email" autocomplete="email" aria-describedby="email-err" required inputmode="email" autocapitalize="off" spellcheck="false">
        </div>
        <p class="err" id="email-err" hidden></p>
      </div>
      <div class="field">
        <label for="f-code">Verification code</label>
        <div class="input">
          <input id="f-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-describedby="code-err code-hint" required autofocus>
        </div>
        <p class="hint" id="code-hint">Not there? Check your spam folder.</p>
        <p class="err" id="code-err" hidden></p>
      </div>
      <button class="btn primary block" type="submit"><span>Confirm email</span><svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>

    <p class="switch">No code? <a href="#" data-resend>Send a new code</a> · <a href="/signup" data-keep-next>Use another email</a></p>
  </section>
  <p class="auth-fine reveal" style="--d:80ms">Still no code? <a href="mailto:valentin.israel@cashxchain.com">Talk to us</a>.</p>
</main>

<footer class="auth-foot"><span>© 2026 CashXChain Inc.</span><a href="/">Home</a><a href="/about.html">How it works</a><a href="mailto:valentin.israel@cashxchain.com">Contact</a></footer>
</body>
</html>
