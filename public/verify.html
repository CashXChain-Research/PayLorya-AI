      <div class="field" id="email-field">

      <div class="field">
        <label for="f-code">Verification code</label>

          <input id="f-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-describedby="code-err code-hint" required autofocus>
        </div>

        <p class="err" id="code-err" hidden></p>
